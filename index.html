<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        /* General Page Styling */
        body {
            background-color: #f5f7fa;
            width: 100%;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        /* Loader Styling */
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Card Layout */
        .redirect-container {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            width: 400px;
            text-align: center;
        }

        /* Text Styling */
        .message {
            margin-top: 15px;
            font-size: 18px;
            color: #333;
        }

        /* Secondary Message */
        .secondary-message {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        /* Link Styling */
        .manual-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

    <script>
        function redirectToTarget() {
            const target = new URLSearchParams(window.location.search).get("target");
            if (target) {
                setTimeout(() => {
                    window.location.href = target;
                }, 5000);
            }
        }

        window.onload = redirectToTarget;
    </script>
</head>
<body>

    <div class="redirect-container">
        <div class="loader"></div>
        <p class="message">Redirecting... Please wait.</p>
        <p class="secondary-message">
            If the site did not automatically redirect, 
            <a class="manual-link" href="#">click here</a>.
        </p>
    </div>

</body>
</html>
