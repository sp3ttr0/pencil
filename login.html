<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #eee !important;
        }
        .wrapper {
            margin-top: 80px;
            margin-bottom: 80px;
        }
        .form-signin {
            max-width: 380px;
            padding: 15px 35px 45px;
            margin: 0 auto;
            background-color: #fff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .form-signin .form-control {
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <form class="form-signin" action="/login" method="POST">       
            <h2 class="form-signin-heading text-center">Please Login</h2>
            <input type="email" class="form-control mb-3" name="username" placeholder="Email Address" required autofocus>
            <input type="password" class="form-control mb-3" name="password" placeholder="Password" required>      
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe" name="rememberMe">
                <label class="form-check-label" for="rememberMe"> Remember me </label>
            </div>
            <button class="btn btn-lg btn-primary w-100" type="submit">Login</button>   
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
